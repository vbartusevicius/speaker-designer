[project]
name = "speaker-enclosure-calc"
version = "0.1.0"
description = "Interactive loudspeaker & subwoofer enclosure designer with EU driver catalog, BEM acoustics, ngspice crossover check, and CNC exports."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "numpy==2.0.2",
    "ezdxf==1.3.4",
    "plotly==5.24.1",
    "bempp-cl==0.3.2",
    "numba==0.60.0",
    "scipy==1.14.1",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "8.3.4"
httpx = "0.28.1"
mypy = "2.4.1"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
